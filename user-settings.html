<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/user.style.css">
    <title>place keeper</title>
</head>

<body>
    <main>
        <header>
            <a href="./index.html">Home</a>
            <a href="./user-settings.html">Settings</a>
            <a href="./map.html">Map</a>
        </header>

        <form class="user-form" onsubmit="onSubmit(event)">
            <label for="name">Name:</label>
            <input type="text" id="name" required name="name" placeholder="Enter your name" />

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" />

            <label for="age">Age: <span id="sAge">26</span></label>
            <input type="range" id="age" name="age" step="1" min="1" max="120" value="26"
                onchange="showAge(this.value)" />

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" />

            <label for="color">Set background color: </label>
            <input type="color" id="color" name="color" value="#ff0000" />

            <button>Submit</button>
        </form>
    </main>

    <div class="gradient-background">
        <div class="gradient-sphere sphere-1"></div>
        <div class="gradient-sphere sphere-2"></div>
        <div class="gradient-sphere sphere-3"></div>
        <div class="particles-container"></div>
    </div>

    <script src="js/services/util.service.js"></script>
    <script src="js/services/storage.service.js"></script>
    <script src="js/services/user.service.js"></script>
    <script src="js/controller.js"></script>
    <script src="js/particle.js"></script>
</body>

</html>
